name: Monthly PIF strong refresh

on:
  # 00:00 UTC on the 1st of every month.
  schedule:
    - cron: '0 0 1 * *'
  # Handy for a one-off refresh without waiting for the 1st.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pif-strong
  cancel-in-progress: false

jobs:
  strong:
    runs-on: ubuntu-latest
    steps:
      # The automation lives on pif-auto, never on the APK branch (pif-apk).
      - name: Check out the automation branch
        uses: actions/checkout@v4
        with:
          ref: pif-auto
          fetch-depth: 0
          persist-credentials: true

      # actions/checkout can leave HEAD detached; update-now and update_pif-fp
      # both call a bare `git push`, which needs a real local branch.
      - name: Attach HEAD to a local branch
        run: git checkout -B pif-auto origin/pif-auto

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install apktool, Android build-tools, xmllint
        env:
          APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          sudo curl -fsSL "$APKTOOL_URL" -o /usr/local/bin/apktool.jar
          printf '%s\n' '#!/bin/sh' 'exec java -jar /usr/local/bin/apktool.jar "$@"' \
            | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod 0755 /usr/local/bin/apktool

          # apksigner and zipalign ship with the preinstalled Android SDK.
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK/build-tools" ]; then
            BT="$(ls "$SDK/build-tools" | sort -V | tail -n1)"
            echo "$SDK/build-tools/$BT" >> "$GITHUB_PATH"
          else
            echo "::error::Android SDK build-tools not found (apksigner/zipalign missing)"
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Exactly the route used locally: fetch a live keybox + --no-rkp path.
      - name: Run the strong route
        run: |
          chmod +x update-now fetch-keybox-now.sh autopif.sh update_pif-fp
          ./update-now --strong

      # Non-fatal: --strong uses AOSP test certs, so a dead keybox mirror does
      # not block the fingerprint/APK update. It only means keybox.xml is stale.
      - name: Report keybox upstream health
        run: |
          if [ -s keybox.xml ]; then
            echo "keybox.xml present ($(wc -c < keybox.xml) bytes)"
          else
            echo "::warning::keybox.xml missing or empty - upstream keybox fetcher looks dead. PIF update still completed."
          fi

      # update-now silences its git output, so confirm the commits really landed.
      - name: Verify commits reached pif-auto
        run: |
          REMOTE="$(git ls-remote origin refs/heads/pif-auto | awk '{print $1}')"
          LOCAL="$(git rev-parse HEAD)"
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::push check failed: local $LOCAL, remote $REMOTE"
            exit 1
          fi
          echo "pushed $LOCAL to pif-auto"
